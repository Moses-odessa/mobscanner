name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FLUTTER_VERSION: '3.47.0-0.3.pre'
  FLUTTER_CHANNEL: 'beta'

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # Кодоген Drift и локализаций — чтобы CI использовал свежие файлы.
      - name: Code generation (Drift, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Code generation (Drift, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      # Модели Tesseract не хранятся в git — скачиваем перед сборкой.
      - name: Download OCR models
        run: |
          cd assets/tessdata
          for lang in eng rus ukr; do
            curl -sSLO "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
          done

      - name: Build APK (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
