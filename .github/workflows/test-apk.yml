name: Build test APK

# Ручной запуск: Actions → Build test APK → Run workflow.
# Собирает release-APK с debug-подписью (без keystore/секретов) —
# устанавливается на телефон для тестирования (НЕ для Google Play).
# Для магазина используйте workflow "Release APK" с секретами keystore.
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0-0.3.pre'
  FLUTTER_CHANNEL: 'beta'

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Code generation (Drift, l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      # Модели Tesseract не хранятся в git — скачиваем перед сборкой.
      - name: Download OCR models
        run: |
          cd assets/tessdata
          for lang in eng rus ukr; do
            curl -sSLO "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata"
          done

      # --split-per-abi: отдельный APK на архитектуру вместо universal.
      # Убирает нативные библиотеки чужих ABI — размер падает примерно втрое.
      - name: Build APK (release, debug-signed, per-ABI)
        run: flutter build apk --release --split-per-abi

      - name: Report APK sizes
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      # arm64-v8a подходит практически всем современным телефонам.
      - uses: actions/upload-artifact@v7
        with:
          name: test-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
