org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Use the Windows certificate store so TLS-intercepting proxies/antivirus
# (whose root CA lives in Windows-ROOT but not in the JDK cacerts) don't break
# dependency downloads with PKIX errors.
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
# Kotlin's incremental compiler fails to release its cache files on this
# Windows setup ("Could not close incremental caches"), breaking every plugin's
# compileDebugKotlin task. Full recompiles are slower but reliable.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
